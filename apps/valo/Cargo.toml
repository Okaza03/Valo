[package]
name = "valo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A small, fast video player and media library client"

[dependencies]
eframe = "0.31"
cpal = "0.18"
rfd = "0.17"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Linux builds FFmpeg from source and links it statically.
[target.'cfg(not(windows))'.dependencies]
ffmpeg-next = { version = "9.0", features = ["build", "build-lib-dav1d"] }
# keeps the screen awake during playback (org.freedesktop.ScreenSaver)
zbus = "5"

# FFmpeg's build needs a Unix shell, so Windows links a prebuilt FFmpeg
# (`cargo xtask ffmpeg` downloads it to target/ffmpeg) and ships its DLLs next to the exe.
[target.'cfg(windows)'.dependencies]
ffmpeg-next = "9.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "valo"
section = "video"
priority = "optional"
depends = "$auto"
extended-description = "A small, fast video player built with egui and FFmpeg."
assets = [
  ["target/release/valo", "usr/bin/", "755"],
  ["../../packaging/valo.desktop", "usr/share/applications/", "644"],
  ["../../packaging/valo.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]