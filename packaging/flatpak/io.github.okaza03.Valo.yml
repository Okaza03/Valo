# Packages the release binary CI builds on Ubuntu 22.04 (target/release/valo)
# instead of compiling inside flatpak-builder, which would need vendored crates and
# an offline FFmpeg build. A binary built on a newer distro won't run here: the
# runtime's glibc must be at least as new as the build machine's.
id: io.github.okaza03.Valo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: valo
finish-args:
  - --share=network        # media server, update check
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio    # ALSA output goes through the runtime's pulse plugin
  - --device=dri
  - --talk-name=org.freedesktop.ScreenSaver   # keep the screen awake while playing
  - --talk-name=org.gnome.SessionManager      # same, on GNOME
  - --talk-name=org.freedesktop.Flatpak       # update: the host's flatpak installs the new bundle
  - --filesystem=xdg-videos:ro   # other files come in via the file-chooser portal
  - --filesystem=xdg-run/discord-ipc-0                    # Discord status ("Watching Valo")
  - --filesystem=xdg-run/app/com.discordapp.Discord:ro   # same, with Discord as a Flatpak
modules:
  - name: valo
    buildsystem: simple
    build-commands:
      - install -Dm755 valo /app/bin/valo
      - install -Dm644 valo.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - sed 's/^Icon=valo$/Icon='"${FLATPAK_ID}"'/' valo.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
    sources:
      - type: file
        path: ../../target/release/valo
      - type: file
        path: ../valo.desktop
      - type: file
        path: ../valo.svg
      - type: file
        path: io.github.okaza03.Valo.metainfo.xml
