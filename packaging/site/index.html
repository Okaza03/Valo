<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valo: a video player for your own media library</title>
    <meta name="description" content="Valo is a small, fast video player and media library client for your own movies and shows. Windows, Linux, Android TV and Android." />
    <meta name="theme-color" content="#121317" />
    <meta property="og:title" content="Valo" />
    <meta property="og:description" content="A small, fast video player for your own media library." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="@BASE@/" />
    <link rel="icon" type="image/svg+xml" href="./valo.svg" />
    <!--
      packaging/flatpak/publish-repo.sh fills these in when it publishes the
      site (sed over the built index.html). Left as they are, the page is a
      local preview and src/release.ts falls back to the latest release.
    -->
    <script id="valo-release" type="application/json">
      { "base": "@BASE@", "dl": "@DL@", "tag": "@TAG@", "version": "@VERSION@" }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font: 16px system-ui; color: #ececee; background: #121317; padding: 24px">
        Valo: a small, fast video player for your own media library.
        <a style="color: #6a93fa" href="https://github.com/Okaza03/Valo/releases/latest">Download it from the release page</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
