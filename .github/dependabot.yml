version: 2
updates:
  # Patch bumps come as one PR. Minor and major bumps come one per crate:
  # most of ours are 0.x (iced, cpal, rfd, image), where a minor bump breaks.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      cargo-patch:
        update-types: [patch]
    # big rewrites, upgraded by hand: ureq 3 drops the body from error
    # statuses, and every iced 0.x minor reworks widgets and the runtime
    ignore:
      - dependency-name: ureq
        update-types: [version-update:semver-major]
      - dependency-name: iced
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # the Compose BOM, media3 and the Kotlin plugins move together
  - package-ecosystem: gradle
    directory: /apps/androidtv
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      android-minor:
        update-types: [minor, patch]

  # the website
  - package-ecosystem: npm
    directory: /packaging/site
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      site:
        update-types: [minor, patch]
