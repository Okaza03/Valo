name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          # built natively: bindgen needs clang >= 19 for MSVC's ARM64 headers
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup update stable --no-self-update

      # LLVM (libclang for bindgen, clang for ring) and Inno Setup come with
      # the runner images
      - name: FFmpeg
        run: cargo xtask ffmpeg ${{ matrix.arch }}

      - run: cargo xtask installer ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            target/dist/*.zip
            target/dist/*-setup.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # the runner image has the Android SDK and JDK 17
      - name: APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          KEYSTORE_BASE64: ${{ secrets.VALO_KEYSTORE_BASE64 }}
          VALO_KEYSTORE_PASSWORD: ${{ secrets.VALO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export VALO_KEYSTORE="$RUNNER_TEMP/release.jks"
          else
            # debug-signed APKs can't update each other between builds
            echo "::warning::VALO_KEYSTORE_BASE64 isn't set; the APK is signed with a throwaway debug key"
          fi
          cd apps/androidtv
          ./gradlew --no-daemon assembleTvRelease assemblePhoneRelease
          mkdir -p ../../target/dist
          cp app/build/outputs/apk/tv/release/app-tv-release.apk \
            "../../target/dist/valo-${GITHUB_REF_NAME}-androidtv.apk"
          cp app/build/outputs/apk/phone/release/app-phone-release.apk \
            "../../target/dist/valo-${GITHUB_REF_NAME}-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: target/dist/*.apk

  linux:
    needs: [windows, android]        # so SHA256SUMS.txt covers the Windows and Android files
    runs-on: ubuntu-24.04
    container: ubuntu:22.04          # glibc 2.35 -> runs on Debian 12, Mint 21+
    env:
      DEBIAN_FRONTEND: noninteractive
      APP: valo               # <-- check: your binary name
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: System deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates wget file xz-utils \
            pkg-config clang libclang-dev nasm ninja-build python3-pip patchelf \
            librsvg2-bin desktop-file-utils \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          pip3 install meson

      - uses: actions/checkout@v7

      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Static dav1d (so no libdav1d.so is needed at runtime)
        run: |
          git clone --depth 1 --branch 1.4.3 https://code.videolan.org/videolan/dav1d.git
          cd dav1d
          meson setup build --buildtype=release --default-library=static \
            --prefix=/opt/dav1d --libdir=lib -Denable_tools=false -Denable_tests=false
          ninja -C build install
          echo "PKG_CONFIG_PATH=/opt/dav1d/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != Cargo.toml v$V"; exit 1; }
          # notes.md is the release description: rewrite it for every release
          head -n1 notes.md | grep -qF "v$V" \
            || { echo "notes.md's first line must name v$V; write this release's notes"; exit 1; }
          grep -qF "<release version=\"$V\"" packaging/flatpak/io.github.okaza03.Valo.metainfo.xml \
            || { echo "add <release version=\"$V\"> to the Flatpak metainfo"; exit 1; }

      - run: cargo install cargo-deb --locked
      - run: cargo xtask dist
      - run: cargo xtask deb

      - name: Verify portability
        run: |
          BIN=target/release/$APP
          MAX=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Max glibc required: $MAX"
          [ "$(printf '%s\n2.35\n' "$MAX" | sort -V | tail -1)" = "2.35" ] \
            || { echo "Needs glibc newer than 2.35"; exit 1; }
          ldd "$BIN"
          ! ldd "$BIN" | grep -qi 'dav1d' || { echo "dav1d is dynamically linked"; exit 1; }

      - name: AppImage
        run: |
          # adjust these two paths to wherever the files live in your repo
          DESKTOP=packaging/valo.desktop
          ICON_SVG=packaging/valo.svg

          desktop-file-validate "$DESKTOP"
          rsvg-convert -w 256 -h 256 "$ICON_SVG" -o valo.png

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage

          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable target/release/$APP \
            --desktop-file "$DESKTOP" \
            --icon-file valo.png
          # also ship the SVG so it stays sharp at any size
          install -Dm644 "$ICON_SVG" AppDir/usr/share/icons/hicolor/scalable/apps/valo.svg

          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir \
            "target/dist/$APP-${GITHUB_REF_NAME}-x86_64.AppImage"

      - uses: actions/download-artifact@v8
        with:
          pattern: "{windows-*,android}"
          merge-multiple: true
          path: target/dist

      - run: |
          sha256sum target/dist/*.tar.gz target/dist/*.AppImage target/debian/*.deb target/dist/*.zip target/dist/*-setup.exe target/dist/*.apk > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: notes.md
          files: |
            target/dist/*.tar.gz
            target/dist/*.AppImage
            target/debian/*.deb
            target/dist/*.zip
            target/dist/*-setup.exe
            target/dist/*.apk
            SHA256SUMS.txt

      # the Flatpak job packages this exact binary
      - uses: actions/upload-artifact@v7
        with:
          name: valo-bin
          path: target/release/${{ env.APP }}

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: linux-x86_64
          path: |
            target/dist/*
            target/debian/*.deb

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: valo-bin
          path: target/release

      # signs the Flatpak repository (see packaging/flatpak/README.md)
      - name: Import the repository's signing key
        id: gpg
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "Set the FLATPAK_GPG_KEY secret: see packaging/flatpak/README.md"; exit 1; }
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.okaza03.Valo.yml
          repo-dir: repo
          gpg-sign: ${{ steps.gpg.outputs.id }}
          # publish-repo.sh builds it, naming the repository for `flatpak update`
          build-bundle: false
          upload-artifact: false
          cache: false

      - name: Repository, website and bundle
        env:
          # the website's download links (a test run without a tag uses Cargo.toml's version)
          VALO_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          packaging/flatpak/publish-repo.sh repo site "valo-${GITHUB_REF_NAME}-x86_64.flatpak" "${{ steps.gpg.outputs.id }}"
          # its own checksums file: SHA256SUMS.txt is already published by now
          sha256sum valo-*.flatpak > SHA256SUMS-flatpak.txt

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: |
            valo-*.flatpak
            SHA256SUMS-flatpak.txt

      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

  # https://okaza03.github.io/Valo/: `flatpak install`/`flatpak update` read it
  pages:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # After the repository is live: the app updates itself once the bundle is
  # on the release, and by then `flatpak update` finds the same version.
  flatpak-release:
    needs: pages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            valo-*.flatpak
            SHA256SUMS-flatpak.txt
